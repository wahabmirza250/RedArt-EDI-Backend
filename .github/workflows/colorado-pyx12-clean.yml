name: colorado-pyx12-clean

on:
  push:
    branches:
      - fix/colorado-atypical-pyx12-clean
  pull_request:
    paths:
      - "apps/edi/**"
      - "requirements.txt"
      - ".github/workflows/colorado-pyx12-clean.yml"

jobs:
  pyx12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run synthetic Colorado pyx12 tests
        env:
          DJANGO_SETTINGS_MODULE: redartdigital.settings.local
        run: pytest -q apps/edi/tests_pyx12_preflight.py apps/edi/tests_receiver_requirements.py
      - name: Import guarded preparation command
        env:
          DJANGO_SETTINGS_MODULE: redartdigital.settings.local
        run: python manage.py help prepare_hcpf_one_shot >/dev/null
      - name: Check upload guard and directional mailbox paths
        env:
          DJANGO_SETTINGS_MODULE: redartdigital.settings.local
        run: python manage.py test apps.edi.tests.ReceiverUploadGuardTests apps.edi.tests.HcpfSftpPathSwapTests --noinput
